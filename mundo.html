<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>La isla · Penguin Endless Love</title>
<meta name="theme-color" content="#121b24">
<link rel="icon" type="image/png" href="monogram.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400..700;1,400..600&family=Hanken+Grotesk:wght@300..600&display=swap">
<link rel="stylesheet" href="site.css">
<link rel="stylesheet" href="eco.css">
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body data-collection="love" class="world-page">
<div class="world">
  <canvas id="worldCanvas" aria-label="La isla donde viven los pingüinos" role="img"></canvas>
  <div class="world-ui">
    <div id="tags"></div>
    <div class="world-top">
      <a class="brand" href="index.html" aria-label="Penguin Endless Love"><img src="logo-white.png" alt="Penguin Endless Love" width="86" height="63"></a>
      <div class="world-heading">
        <h1 class="world-title" data-i18n="world.title">La isla</h1>
        <p class="world-count" id="count"></p>
      </div>
      <div class="lang" role="group" aria-label="Idioma / Language">
        <button type="button" data-lang="es" aria-pressed="true">ES</button>
        <button type="button" data-lang="en" aria-pressed="false">EN</button>
      </div>
    </div>
    <div class="world-bottom">
      <div class="pcard" id="pcard" hidden aria-live="polite">
        <button type="button" class="dialog-close" id="pcClose"><span class="sr-only" data-i18n="world.close">Cerrar</span><span aria-hidden="true">×</span></button>
        <h2 class="pcard-name" id="pcName"></h2>
        <p class="pcard-p" id="pcP"></p>
        <p class="pcard-act" id="pcAct"></p>
        <p class="pcard-meta" id="pcMeta"></p>
        <div class="pcard-actions">
          <button type="button" class="btn btn-solid btn-small" id="followBtn" data-i18n="world.follow">Seguir</button>
          <a class="btn btn-ghost btn-small" id="pcCert" href="p.html" data-i18n="world.certificate">Certificado</a>
        </div>
      </div>
      <p class="world-hint" data-i18n="world.hint">Arrastra para girar. Toca un pingüino para conocerlo.</p>
      <div class="world-actions">
        <button type="button" class="btn btn-ghost btn-small" id="allBtn" data-i18n="world.all">Ver toda la isla</button>
        <button type="button" class="btn btn-solid btn-small" id="mineBtn" hidden data-i18n="world.mine">Mi pingüino</button>
      </div>
    </div>
  </div>
  <div class="world-loading" id="loading" data-i18n="world.loading">Llegando a la isla…</div>
</div>
<script type="module" src="world.js"></script>
</body>
</html>
